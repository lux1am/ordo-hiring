name: pages

# Публикация статической формы на GitHub Pages: hr.aiordo.ru.
#
# Страница не берётся из репозитория как есть — она собирается здесь же из
# questions.json и templates/form.html. Иначе на домене могла бы оказаться
# анкета с устаревшими вопросами, если кто-то правил источники и забыл
# пересобрать.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Домен один, и раскатывать в него два прогона одновременно нельзя.
# Идущий деплой при этом не отменяется: прерванная публикация оставила бы
# на домене половину страницы.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # Сборку выполняет python3, он есть на раннере из коробки: у
      # build_gs.py нет сторонних зависимостей ровно ради таких запусков.
      - name: Сборка статической страницы
        run: npm run build

      # dist/CNAME собирается вместе со страницей — без него Pages потеряет
      # свой домен при первом же деплое.
      - name: Проверка, что домен на месте
        run: |
          test -f dist/CNAME || { echo "нет dist/CNAME — домен отвалится"; exit 1; }
          test -f dist/index.html || { echo "нет dist/index.html"; exit 1; }
          echo "домен: $(cat dist/CNAME)"

      # В артефакт уходит папка целиком, а README.md здесь — внутренняя
      # инструкция: на домене для кандидатов ей делать нечего. Убирается
      # только из рабочей копии прогона, в репозитории файл остаётся.
      - name: Убрать внутреннюю документацию из артефакта
        run: rm -f dist/README.md

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
