<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Анкета отправлена</title>
<style>
  body {
    margin: 0; padding: 24px 16px;
    background: #f5f5f4; color: #1c1917;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .card {
    max-width: 700px; width: 100%;
    background: #fff; border: 1px solid #d6d3d1; border-radius: 8px;
    padding: 40px 32px; text-align: center;
  }
  h1 { font-size: 24px; margin: 0 0 12px; font-weight: 650; }
  p { color: #57534e; margin: 0 0 8px; }
  p:last-child { margin-bottom: 0; }
  @media (max-width: 560px) { .card { padding: 28px 20px; } h1 { font-size: 21px; } }
</style>
</head>
<body>
  <div class="card">
    <h1>Спасибо, анкета отправлена</h1>
    <p>Мы изучим ваши ответы и свяжемся с вами в Telegram.</p>
    <p>Отправлять анкету повторно не нужно.</p>
  </div>
</body>
</html>
