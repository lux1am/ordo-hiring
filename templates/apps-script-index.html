<!doctype html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title><?= QUESTIONS.title ?></title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><?= QUESTIONS.title ?></h1>
    <p class="intro"><?= QUESTIONS.intro ?></p>
  </header>

  <form method="post" action="<?= formUrl ?>" id="form">
    <div class="hp" aria-hidden="true">
      <label for="<?= honeypot ?>">Не заполняйте это поле</label>
      <input type="text" id="<?= honeypot ?>" name="<?= honeypot ?>" tabindex="-1" autocomplete="off">
    </div>

    <section>
      <h2>О себе</h2>
      <div class="field">
        <label for="fio">Фамилия, имя, отчество (при наличии)</label>
        <input type="text" id="fio" name="fio" autocomplete="name" required
          minlength="5" maxlength="200" pattern="\S+\s+\S+.*"
          title="Укажите имя и фамилию через пробел">
        <div class="field-error" data-error-for="fio"></div>
      </div>
      <div class="field">
        <label for="telegram">Telegram</label>
        <div class="hint">Например, @username</div>
        <input type="text" id="telegram" name="telegram" autocomplete="off" required
          pattern="\s*(?:https?://)?(?:t\.me/)?@?[A-Za-z0-9_]{4,32}\s*"
          title="Например: @username или t.me/username">
        <div class="field-error" data-error-for="telegram"></div>
      </div>
      <div class="field">
        <label for="resume_url">Ссылка на резюме или профиль на площадке</label>
        <div class="hint">hh.ru, LinkedIn, Google Docs или любая открытая ссылка</div>
        <input type="url" id="resume_url" name="resume_url" required maxlength="2000"
          title="Ссылка должна начинаться с http:// или https://">
        <div class="field-error" data-error-for="resume_url"></div>
      </div>
    </section>

    <section>
      <h2>Условия работы</h2>
      <? for (var i = 0; i < QUESTIONS.stop_questions.length; i++) {
           var sq = QUESTIONS.stop_questions[i]; ?>
      <div class="stop-q">
        <div class="q-text"><?= sq.text ?></div>
        <div class="radio-row">
          <!-- Без required намеренно: сам input скрыт стилями (.radio-row input),
               роль кнопки играет label. Нативная валидация на скрытом поле
               может заблокировать отправку, не показав сообщения. Ответ
               проверяет сервер — см. validate() в Code.gs. -->
          <? for (var o = 0; o < sq.options.length; o++) { ?>
          <label>
            <input type="radio" name="<?= sq.field ?>" value="<?= sq.options[o] ?>"><span><?= sq.options[o] ?></span>
          </label>
          <? } ?>
        </div>
        <div class="field-error" data-error-for="<?= sq.field ?>"></div>
      </div>
      <? if (sq.extra) { ?>
      <div class="stop-q">
        <label for="<?= sq.extra.field ?>"><?= sq.extra.label ?></label>
        <input type="text" id="<?= sq.extra.field ?>" name="<?= sq.extra.field ?>" required
          maxlength="<?= sq.extra.max_length ?>" placeholder="<?= sq.extra.placeholder ?>"
          title="Напишите свой часовой пояс: МСК, МСК+2 или город">
        <div class="field-error" data-error-for="<?= sq.extra.field ?>"></div>
      </div>
      <? } ?>
      <? } ?>
    </section>

    <section>
      <h2>Мотивация и ожидания</h2>
      <? for (var f = 0; f < QUESTIONS.flag_questions.length; f++) {
           var fq = QUESTIONS.flag_questions[f]; ?>
      <div class="stop-q">
        <div class="q-text"><?= fq.text ?></div>
        <? if (fq.hint) { ?><div class="hint"><?= fq.hint ?></div><? } ?>
        <? if (fq.type === 'multi') { ?>
        <div class="radio-row" data-choice-group="<?= fq.field ?>"
          data-min-choices="<?= fq.min_choices ?>" data-max-choices="<?= fq.max_choices ?>">
          <? for (var m = 0; m < fq.options.length; m++) { ?>
          <label>
            <input type="checkbox" name="<?= fq.field ?>" value="<?= fq.options[m] ?>"><span><?= fq.options[m] ?></span>
          </label>
          <? } ?>
        </div>
        <? if (fq.other_option) { ?>
        <!-- Без hidden в разметке намеренно: при отключённом JavaScript поле
             осталось бы скрытым навсегда, и выбравший «Другое» не смог бы
             ответить. Прячет его syncChoiceGroup сразу при загрузке. -->
        <div class="sub-field" data-other-box="<?= fq.field ?>">
          <input type="text" name="<?= fq.field ?>_other"
            maxlength="<?= fq.other_max_length ?>" placeholder="<?= fq.other_placeholder ?>"
            data-other-for="<?= fq.field ?>" data-other-value="<?= fq.other_option ?>">
          <div class="field-error" data-error-for="<?= fq.field ?>_other"></div>
        </div>
        <? } ?>
        <? } ?>
        <? if (fq.type === 'single') { ?>
        <div class="radio-row">
          <? for (var s = 0; s < fq.options.length; s++) { ?>
          <label>
            <input type="radio" name="<?= fq.field ?>" value="<?= fq.options[s] ?>"><span><?= fq.options[s] ?></span>
          </label>
          <? } ?>
        </div>
        <? } ?>
        <? if (fq.type === 'rank') { ?>
        <div class="rank" data-rank-group="<?= fq.field ?>">
          <? for (var r = 0; r < fq.rows.length; r++) {
               var row = fq.rows[r]; ?>
          <div class="rank-row">
            <label for="<?= row.field ?>"><?= row.label ?></label>
            <select id="<?= row.field ?>" name="<?= row.field ?>" required>
              <option value="">—</option>
              <? for (var p = 0; p < fq.places.length; p++) { ?>
              <option value="<?= fq.places[p] ?>"><?= fq.places[p] ?></option>
              <? } ?>
            </select>
          </div>
          <? } ?>
        </div>
        <? } ?>
        <div class="field-error" data-error-for="<?= fq.field ?>"></div>
      </div>
      <? } ?>
    </section>

    <section>
      <h2>Вопросы</h2>
      <? for (var j = 0; j < QUESTIONS.open_questions.length; j++) {
           var oq = QUESTIONS.open_questions[j]; ?>
      <div class="field">
        <span class="q-num"><?= oq.label ?></span>
        <div class="q-text"><?= oq.text ?></div>
        <? if (oq.text_label) { ?><div class="hint"><?= oq.text_label ?></div><? } ?>
        <textarea id="<?= oq.field ?>" name="<?= oq.field ?>" data-telemetry="<?= oq.field ?>"
          <? if (oq.short) { ?>class="short"<? } ?>
          data-min="<?= oq.min_length || 0 ?>"
          <? if (oq.max_length) { ?>maxlength="<?= oq.max_length ?>"<? } ?>
          required></textarea>
        <div class="counter" data-counter-for="<?= oq.field ?>"></div>
        <div class="field-error" data-error-for="<?= oq.field ?>"></div>
      </div>
      <? } ?>
    </section>

    <section>
      <div class="consent">
        <input type="checkbox" id="pdn_consent" name="pdn_consent" value="1" required>
        <label for="pdn_consent"><?= QUESTIONS.consent_text ?></label>
      </div>
      <div class="field-error" data-error-for="pdn_consent"></div>
      <div class="hint consent-note">Форма фиксирует технические параметры заполнения — время и способ ввода. Эти данные не влияют на оценку и используются только для проверки подлинности ответов.</div>
    </section>

    <input type="hidden" name="telemetry" id="telemetry">
    <!-- Метка размещения. Здесь она почти всегда пустая: ссылки с ?src=
         раздаются на статическую страницу, а не на адрес Apps Script. Поле
         всё равно есть — общий JS один на оба варианта формы. -->
    <input type="hidden" name="source" id="source">
    <div class="error" id="form-error" hidden></div>
    <button type="submit" id="submit-btn">Отправить анкету</button>
  </form>
</div>

<script data-adapter>
// Отправка для варианта с Apps Script. google.script.run работает на
// колбэках, поэтому оборачиваем его в промис — общий код ниже ждёт
// именно промис с { ok, errors }.
window.submitPayload = function (data) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      .submitForm(data);
  });
};
</script>

<script>
//__JS__
</script>
</body>
</html>
